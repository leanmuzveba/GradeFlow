  <text x="250" y="105" font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="80" font-weight="900" letter-spacing="3" fill="#dd2987">GRADE</text>
  <!-- flow. -->
  <text x="252" y="195" font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="76" font-weight="800" letter-spacing="-0.5" fill="#ea81b4">flow<tspan fill="#dd2987">.</tspan></text>
