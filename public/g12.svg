    <!-- 4-block brand icon on the left -->
    <!-- Top Left -->
    <rect x="10" y="10" width="80" height="52" rx="10" fill="#f6e8e5" />
    <!-- Bottom Left -->
    <rect x="10" y="74" width="80" height="126" rx="10" fill="#ea81b4" />
    <!-- Top Right -->
    <rect x="102" y="10" width="98" height="92" rx="10" fill="#dd2987" />
    <!-- Bottom Right -->
